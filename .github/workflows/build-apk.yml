name: Build overlay APK

on:
  push:
    branches: [ overlay ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare debug keystore (capture for stable signing)
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$HOME/.android/debug.keystore" "$GITHUB_WORKSPACE/debug.keystore"

      - name: Upload debug keystore artifact (one-time capture)
        uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: debug.keystore
          retention-days: 7
      - name: Build debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jenny-overlay-debug
          path: android/app/build/outputs/apk/debug/*.apk
