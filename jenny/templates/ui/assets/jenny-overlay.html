<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Jenny overlay</title>
<style>
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
  }
  #stage {
    position: fixed; inset: 0;
    display: flex; align-items: flex-end; justify-content: center;
    pointer-events: none;
  }
  #flip { width: 100%; height: 100%; }
  #art {
    display: block; width: 100%; height: 100%;
    object-fit: contain; object-position: center bottom;
  }
  /* Stessa animazione dell'idle "sospeso" della chat (mobile-style.css). */
  #art.bob {
    animation: jenny-bob 3.4s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes jenny-bob {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(var(--jenny-bob, -4px)); }
  }

  /* ---- Livello dedicato ai micro-movimenti (vita idle, caduta, hang):
          separato da #art così i transform inline/animati non entrano in
          conflitto con l'animazione bob e la misura (idleBox) di #art
          resta identica: i valori di __jennyArtTop/__jennyArtBottom sono
          calcolati sul box di #art e non cambiano. ---- */
  #motion { position: relative; width: 100%; height: 100%; }

  #motion .ghost {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: contain; object-position: center bottom;
    pointer-events: none; z-index: -1;
    animation: jenny-trail 0.55s ease-out forwards;
  }
  @keyframes jenny-trail {
    0%   { opacity: .5; transform: translate(0, 0) scale(1); }
    100% { opacity: 0;  transform: translate(2px, -10px) scale(1.03); }
  }

  /* Posa "fall": stretch morbido + wobble (volo del controller nativo). */
  #motion.glide {
    animation: jenny-glide 0.9s ease-in-out infinite;
    transform-origin: 50% 100%;
  }
  @keyframes jenny-glide {
    0%,100% { transform: scale(1, 1) rotate(0); }
    50%     { transform: scale(1.05, 0.93) rotate(-2deg); }
  }

  /* Posa "hang": leggera oscillazione da appeso. */
  #motion.dangle {
    animation: jenny-dangle 1.4s ease-in-out infinite;
    transform-origin: 50% 0%;
  }
  @keyframes jenny-dangle {
    0%,100% { transform: rotate(2deg); }
    50%     { transform: rotate(-2.5deg); }
  }

  /* Atterraggio fall -> ground: schiacciata e ritorno (squash-and-settle). */
  #motion.landing {
    animation: jenny-landing 0.28s ease-out;
    transform-origin: 50% 100%;
  }
  @keyframes jenny-landing {
    0%   { transform: scale(1.12, 0.82); }
    55%  { transform: scale(0.96, 1.05); }
    100% { transform: scale(1, 1); }
  }

  /* Sonno: art leggermente attenuata (filtro, nessun effetto su layout). */
  #art.sleepy { filter: brightness(0.72) saturate(0.9); }

  /* "Zzz" fluttuanti: overlay assoluto, pointer-events:none. */
  #zzz {
    position: absolute; inset: 0;
    pointer-events: none;
  }
  #zzz span {
    position: absolute; display: block;
    font: bold 22px/1 sans-serif;
    color: rgba(70, 80, 130, 0.85);
    opacity: 0; animation: jenny-zzz 2.6s ease-out infinite;
  }
  #zzz span:nth-child(2) { animation-delay: .8s; font-size: 17px; }
  #zzz span:nth-child(3) { animation-delay: 1.6s; font-size: 13px; }
  @keyframes jenny-zzz {
    0%   { opacity: 0; transform: translateY(0) scale(.8); }
    25%  { opacity: .9; }
    100% { opacity: 0; transform: translateY(-38px) scale(1.15); }
  }

  /* Bolla di dialogo sopra la testa (può sporgere dal finestrino). */
  #bubble {
    position: absolute; left: 50%;
    pointer-events: none; overflow: visible;
    max-width: 78%;
    background: #fff; color: #333;
    border-radius: 12px; padding: 6px 10px;
    font: 13px/1.25 sans-serif; text-align: center;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
    visibility: hidden;
    opacity: 0;
    transform: translateX(-50%) scale(.6);
    transform-origin: 50% 100%;
    transition: transform .18s ease-out, opacity .18s ease-out,
                visibility 0s linear .18s;
  }
  #bubble.show {
    visibility: visible; opacity: 1;
    transform: translateX(-50%) scale(1);
    transition: transform .18s ease-out, opacity .18s ease-out,
                visibility 0s;
  }
  #bubble.hide {
    visibility: hidden; opacity: 0;
    transform: translateX(-50%) scale(.6);
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="flip"><div id="motion"><img id="art" alt=""></div></div>
    <div id="zzz"></div>
    <div id="bubble"></div>
  </div>
<script>
(function () {
  'use strict';

  var ASSET = '/html-mobile/assets/';
  var ART = {
    idle: 'jenny-idle.webp',
    hang: 'jenny-hang.webp',
    fall: 'jenny-fall.webp',
    ground: 'jenny-ground.webp',
    /* Pose extra: asset già presenti in questa cartella. Non sono mai
       auto-attivate: arrivano solo se il controller le chiede per nome
       (assetFor() aggiunge da sé la variante -color). */
    hello1: 'jenny-hello1.webp',
    hello2: 'jenny-hello2.webp',
    think: 'jenny-think.webp',
    talk1a: 'jenny-talk1a.webp',
    talk1b: 'jenny-talk1b.webp',
    talk2a: 'jenny-talk2a.webp',
    talk2b: 'jenny-talk2b.webp',
    walk1: 'jenny-walk1.webp',
    walk2: 'jenny-walk2.webp'
  };

  var flipEl = document.getElementById('flip');
  var art = document.getElementById('art');

  /* ---- Preferenze condivise con la SPA: stesso origin (127.0.0.1:18790),
          quindi la stessa localStorage usata da shared/mascot.js. ---- */
  function readPref(key, fallback) {
    try {
      var v = localStorage.getItem(key);
      return v === null ? fallback : v;
    } catch (e) { return fallback; }
  }
  function colorEnabled() { return readPref('jenny-mascotte-color', '1') !== '0'; }
  function mascotSize()    { return readPref('jenny-mascotte-size', 'sm'); }

  function assetFor(name) {
    var base = ART[name] || ART.idle;
    if (colorEnabled() && base.indexOf('-color') === -1) {
      base = base.replace(/\.webp$/, '-color.webp');
    }
    return ASSET + base;
  }

  /* ---- Misura del riquadro disegnato (dove finiscono testa/piedi).
          Frazioni rispetto al box dell'elemento: invarianti al resize. ---- */
  var boxCache = {};   // url -> {t, b, l, r}
  function measureArt(url, el) {
    var cw = el.clientWidth || window.innerWidth || 120;
    var ch = el.clientHeight || window.innerHeight || 120;
    var canvas = document.createElement('canvas');
    canvas.width = Math.max(1, cw);
    canvas.height = Math.max(1, ch);
    var ctx = canvas.getContext('2d', { willReadFrequently: true });
    if (!ctx) return null;
    ctx.clearRect(0, 0, cw, ch);
    ctx.drawImage(el, 0, 0, cw, ch);
    var data;
    try { data = ctx.getImageData(0, 0, cw, ch).data; } catch (e) { return null; }
    var top = -1, bottom = -1, left = -1, right = -1, p = 0;
    for (var y = 0; y < ch; y++) {
      for (var x = 0; x < cw; x++) {
        if (data[p + 3] > 12) {
          if (top < 0) top = y;
          bottom = y;
          if (left < 0) left = x;
          right = x;
        }
        p += 4;
      }
    }
    if (top < 0) return null;
    var box = {
      t: top / ch,
      b: (bottom + 1) / ch,
      l: left / cw,
      r: (right + 1) / cw
    };
    boxCache[url] = box;
    return box;
  }

  var idleUrl = assetFor('idle');
  var idleBox = null;   // riquadro dell'idle: è la "linea del suolo" della mascotte

  function afterShown(name) {
    if (name === 'idle') {
      if (!idleBox) idleBox = measureArt(idleUrl, art);
      // Il bob non deve far uscire la testa dal finestrino: corsa limitata
      // dallo spazio trasparente sopra la testa, come fa la chat (solo -4px).
      var headroom = idleBox ? idleBox.t * (art.clientHeight || 0) : 0;
      var lift = Math.max(0, Math.min(4, headroom - 1));
      art.style.setProperty('--jenny-bob', (-lift) + 'px');
      art.classList.add('bob');
    } else {
      art.classList.remove('bob');
    }
  }

  var retries = 0;
  var lastUrl = null;
  var seq = 0;

  /* Comando dal controller Kotlin. Gli stati storici restano
     'idle'|'hang'|'fall'|'ground'; le pose extra di ART sono opzionali e
     mai attivate da qui da sole. */
  function setPose(name, left, life) {
    flipEl.style.transform = left ? 'scaleX(-1)' : 'scaleX(1)';
    /* Il terzo argomento 'life' indica una posa scelta dalla vita idle:
       non deve toccare lo stato logico/sonno/fisica del controller. */
    if (!life) onNativePoseChange(name, left);
    var url = assetFor(name);
    if (lastUrl === url && art.complete && art.naturalWidth > 0) {
      afterShown(name);
      return;
    }
    var mySeq = ++seq;
    var pre = new Image();
    pre.onload = function () {
      if (mySeq !== seq) return; // nel frattempo è arrivata una posa più nuova
      retries = 0;
      art.onload = function () {
        if (mySeq !== seq) return;
        lastUrl = url;
        afterShown(name);
      };
      art.src = url;
    };
    pre.onerror = function () {
      if (mySeq !== seq) return;
      if (retries < 12) {
        retries++;
        setTimeout(function () { if (mySeq === seq) setPose(name, left); }, 800);
      }
    };
    pre.src = url;
  }

  /* Letto da Kotlin a polling finché i piedi non sono misurati. */
  window.__jennyArtTop = function () { return idleBox ? idleBox.t : -1; };
  window.__jennyArtBottom = function () { return idleBox ? idleBox.b : -1; };
  /* Idem in orizzontale: serve al controller per il parcheggio sui bordi
     (tenere visibile >= 1/3 della sprite). idleBox contiene già l/r. */
  window.__jennyArtLeft = function () { return idleBox ? idleBox.l : -1; };
  window.__jennyArtRight = function () { return idleBox ? idleBox.r : -1; };
  window.__jennyPrefs = function () {
    return { size: mascotSize(), color: colorEnabled() };
  };

  /* Comandi dal controller Kotlin (v. sopra: 4 stati storici + pose extra). */
  window.__jennySetPose = function (state, left) { setPose(state, left); };
  /* Pose supportate (chiavi di ART), per il controller nativo. */
  window.__jennyPoseList = function () { return Object.keys(ART); };

  /* =====================================================================
     Vita "idle": micro-movimenti casuali, sonno, fisica di caduta/volo,
     bolla di dialogo ed eventuali frasi ambientali. Tutto gira su timer
     locali e usa CSS transform su #motion (non su #art), così idleBox e i
     valori di __jennyArtTop/__jennyArtBottom restano identici e nessun
     effetto tocca il layout o la misura del controller nativo.
     ===================================================================== */

  var motionEl = document.getElementById('motion');
  var bubbleEl = document.getElementById('bubble');
  var zzzEl = document.getElementById('zzz');

  /* --- Costanti e preferenze (solo lettura da localStorage). --- */
  var SLEEP_AFTER_MS    = 30000;   // idle continuo (ms) prima di dormire
  var AMBIENT_MIN_MS    = 90000;   // intervallo minimo tra frasi ambientali
  var AMBIENT_MAX_MS    = 120000;  // intervallo massimo (estrazione casuale)
  var POSE_GUARD_MS     = 3000;    // niente frasi entro 3s da un cambio posa
  var BUBBLE_DEFAULT_MS = 3000;    // durata standard della bolla

  var PREF_IDLE   = 'jenny-mascotte-idle';
  var PREF_SLEEP  = 'jenny-mascotte-sleep';
  var PREF_BUBBLE = 'jenny-mascotte-bubble';
  var prefs = {
    idle:   readPref(PREF_IDLE, '1')   !== '0',
    sleep:  readPref(PREF_SLEEP, '1')  !== '0',
    bubble: readPref(PREF_BUBBLE, '1') !== '0'
  };

  var activePose = null;        // posa "logica" corrente (comandi nativi)
  var leftSide = false;         // ultimo verso richiesto
  var idleSinceMs = null;       // inizio dell'idle ininterrotto
  var sleeping = false;
  var lastStateChangeAt = 0;    // ultimo vero cambio di posa
  var lastAmbientAt = 0;        // ultima frase ambientale mostrata

  var sleepTimer = null;
  var idleLifeT = null;
  var idleLifeRunning = false;
  var microT = null;
  var ambientTimer = null;
  var bubbleTimer = null;

  /* ---- 1) Micro-vita idle (transform sottili su #motion). ---- */
  function idleLifeAllowed() {
    return prefs.idle && activePose === 'idle' && !sleeping && !document.hidden;
  }
  function startIdleLife() {
    if (idleLifeRunning || !idleLifeAllowed()) return;
    idleLifeRunning = true;
    idleLifeT = setTimeout(idleLifeTick, 1800 + Math.random() * 3600);
  }
  function scheduleLifeNext() {
    if (idleLifeT) { clearTimeout(idleLifeT); idleLifeT = null; }
    if (!idleLifeAllowed()) { idleLifeRunning = false; return; }
    idleLifeRunning = true;
    idleLifeT = setTimeout(idleLifeTick, 2000 + Math.random() * 4000);
  }
  function idleLifeTick() {
    idleLifeT = null;
    if (!idleLifeAllowed()) { idleLifeRunning = false; return; }
    // Ogni tanto una breve posa "viva" già esistente, poi ritorno all'idle.
    if (Math.random() < 0.32) {
      var poses = ['hello1', 'hello2', 'think'];
      var p = poses[Math.floor(Math.random() * poses.length)];
      setPose(p, leftSide, true);
      idleLifeT = setTimeout(function () {
        idleLifeT = null;
        if (idleLifeAllowed()) { setPose('idle', leftSide, true); }
        else { ensureIdleArt(); }
        scheduleLifeNext();
      }, 1500 + Math.random() * 900);
      return;
    }
    applyMicro();
    scheduleLifeNext();
  }
  function applyMicro() {
    if (microT) { clearTimeout(microT); microT = null; }
    var s = (Math.random() * 0.02) + 0.992;             // scala ~0.99..1.01
    var tx = (Math.random() * 6 - 3).toFixed(1) + 'px';
    var ty = (Math.random() * 4 - 2).toFixed(1) + 'px';
    var rt = (Math.random() * 3 - 1.5).toFixed(1) + 'deg';
    motionEl.style.transition = 'transform 1.1s ease-in-out';
    motionEl.style.transform = 'scale(' + s.toFixed(3) + ') translate(' + tx + ',' + ty + ') rotate(' + rt + ')';
    microT = setTimeout(function () {
      microT = null;
      motionEl.style.transition = 'transform 0.8s ease-in-out';
      motionEl.style.transform = '';
    }, 1000);
  }
  function clearMicro() {
    if (microT) { clearTimeout(microT); microT = null; }
    motionEl.style.transition = '';
    motionEl.style.transform = '';
  }
  function stopIdleLife(restoreArt) {
    if (idleLifeT) { clearTimeout(idleLifeT); idleLifeT = null; }
    idleLifeRunning = false;
    clearMicro();
    if (restoreArt) ensureIdleArt();
  }
  function ensureIdleArt() {
    var src = art.getAttribute('src');
    if (src && src !== idleUrl && activePose === 'idle') {
      setPose('idle', leftSide, true);
    }
  }

  /* ---- 2) Sonno ---- */
  function clearSleepTimer() {
    if (sleepTimer) { clearTimeout(sleepTimer); sleepTimer = null; }
  }
  function scheduleSleep() {
    if (!prefs.sleep || sleeping) return;
    if (activePose !== 'idle') return;
    if (document.hidden) return;
    if (sleepTimer) return;
    if (idleSinceMs === null) idleSinceMs = Date.now();
    var wait = Math.max(120, SLEEP_AFTER_MS - (Date.now() - idleSinceMs));
    sleepTimer = setTimeout(enterSleep, wait);
  }
  function enterSleep() {
    sleepTimer = null;
    if (!prefs.sleep || sleeping) return;
    if (activePose !== 'idle' || document.hidden) return;
    stopIdleLife(true);
    sleeping = true;
    art.classList.add('sleepy');
    showZzz();
    clearAmbientTimer();
    hideBubble();
  }
  function doWake() {
    if (!sleeping) return;
    sleeping = false;
    art.classList.remove('sleepy');
    removeZzz();
    startIdleLife();   // non fa nulla se non si è tornati a idle
    scheduleAmbient();
  }
  function showZzz() {
    removeZzz();
    var h = art.clientHeight || flipEl.clientHeight || 300;
    var headTop = idleBox ? Math.max(4, idleBox.t * h) : (h * 0.22);
    var lefts = [48, 56, 51];
    for (var i = 0; i < 3; i++) {
      var s = document.createElement('span');
      s.textContent = 'z';
      s.style.left = lefts[i] + '%';
      s.style.top = (headTop - 34 + i * 7) + 'px';
      zzzEl.appendChild(s);
    }
  }
  function removeZzz() { zzzEl.innerHTML = ''; }

  /* ---- 3) Fisica: volo (fall), atterraggio e hang ---- */
  function onAnimEnd(e) {
    if (e.target === motionEl && e.animationName === 'jenny-landing') {
      motionEl.classList.remove('landing');
      motionEl.removeEventListener('animationend', onAnimEnd);
    }
  }
  function playLanding() {
    motionEl.classList.remove('landing');
    void motionEl.offsetWidth;                    // riavvia l'animazione
    motionEl.classList.add('landing');
    motionEl.addEventListener('animationend', onAnimEnd);
    // Fallback se animationend non arriva (webview): pulizia comunque.
    setTimeout(function () {
      motionEl.classList.remove('landing');
    }, 340);
  }
  function addTrail() {
    removeTrail();
    var trailUrl = assetFor('fall');
    for (var i = 0; i < 2; i++) {
      var g = document.createElement('img');
      g.className = 'ghost';
      g.alt = '';
      g.src = trailUrl;
      motionEl.appendChild(g);
    }
  }
  function removeTrail() {
    var ghosts = motionEl.querySelectorAll('.ghost');
    for (var i = 0; i < ghosts.length; i++) {
      ghosts[i].parentNode.removeChild(ghosts[i]);
    }
  }
  function applyVisualsFor(name, prev) {
    if (name === 'fall') { motionEl.classList.add('glide'); addTrail(); }
    else { motionEl.classList.remove('glide'); removeTrail(); }
    if (name === 'hang') { motionEl.classList.add('dangle'); }
    else { motionEl.classList.remove('dangle'); }
    if (name !== 'idle') clearMicro();
    if (prev === 'fall' && name === 'ground') playLanding();
  }

  /* Cambio posa: aggiorna stato logico, sonno, vita idle, fisica, bolla. */
  function onNativePoseChange(name, left) {
    leftSide = !!left;
    var prev = activePose;
    activePose = name;

    applyVisualsFor(name, prev);

    if (name === 'idle') {
      if (sleeping) doWake();
      if (idleSinceMs === null) idleSinceMs = Date.now();
      scheduleSleep();
      startIdleLife();
    } else {
      if (sleeping) doWake();
      idleSinceMs = null;
      clearSleepTimer();
      stopIdleLife(false);
      hideBubble();
    }

    if (name !== prev) {
      lastStateChangeAt = Date.now();
      scheduleAmbient();
    }
  }

  /* ---- 4) Bolla di dialogo ---- */
  function placeBubble() {
    var h = art.clientHeight || flipEl.clientHeight || 300;
    var headFromBottom = idleBox ? (1 - idleBox.t) * h : (h * 0.55);
    bubbleEl.style.bottom = (headFromBottom + (idleBox ? 10 : 6)) + 'px';
  }
  function showBubble(text, ms) {
    if (bubbleTimer) { clearTimeout(bubbleTimer); bubbleTimer = null; }
    if (!text) return false;
    bubbleEl.textContent = text;
    bubbleEl.classList.remove('hide');
    bubbleEl.classList.add('show');
    placeBubble();
    var dur = (ms === undefined || ms === null) ? BUBBLE_DEFAULT_MS : ms;
    if (dur > 0) {
      bubbleTimer = setTimeout(function () { hideBubble(true); }, dur);
    }
    return true;
  }
  function hideBubble(clearTimers) {
    if (clearTimers && bubbleTimer) { clearTimeout(bubbleTimer); bubbleTimer = null; }
    bubbleEl.classList.remove('show');
    bubbleEl.classList.add('hide');
  }

  /* Bolla esposta al controller Kotlin (chiamata sicura in seguito). */
  window.__jennyBubble = showBubble;

  /* ---- Comandi espliciti del menu rapido nativo (sonno/veglia, refresh) ----
     Il controller non deve inventare pose per "dormire": il sonno è uno stato
     interno (classe .sleepy + Zzz) raggiunto dopo ~30s di idle. Queste API
     espongono lo stesso stato ai comandi del menu (Dormi) e al gating dei
     micro-movimenti. ---- */
  function sleepNow() {
    if (!prefs.sleep || sleeping) return;
    clearSleepTimer();
    if (activePose !== 'idle') {
      // Porta a idle come posa nativa (aggiorna stato logico e timer), poi
      // dorme subito. Il setPose può aver riprogrammato il timer del sonno.
      setPose('idle', leftSide, false);
      clearSleepTimer();
    }
    if (activePose !== 'idle') return; // setPose non riuscita: resta com'è
    stopIdleLife(true);
    sleeping = true;
    art.classList.add('sleepy');
    showZzz();
    clearAmbientTimer();
    hideBubble();
  }
  function wakeNow() {
    if (!sleeping) return;
    doWake();
    if (activePose === 'idle') {
      idleSinceMs = Date.now(); // i ~30s di idle ripartono da adesso
      clearSleepTimer();
      scheduleSleep();
    }
  }
  window.__jennySleep = sleepNow;
  window.__jennyWake = wakeNow;
  window.__jennySleeping = function () { return sleeping; };

  /* Cambio preferenze visive (es. colore dal menu): ricarica la posa corrente
     senza toccare lo stato logico né il sonno (life-style, come la vita idle).
     Se l'URL non cambia (colore identico) il setPose è già un no-op. */
  window.__jennyRefreshArt = function () {
    if (activePose !== null) setPose(activePose, leftSide, true);
  };

  /* ---- 5) Frasi ambientali opzionali (brevissime, lingua del file) ---- */
  var AMBIENT_LINES = {
    night:   ['Buona notte!', 'Notte, notte.'],
    morning: ['Buongiorno!', 'Ciao! Buona giornata.', 'Ehi, buongiorno!'],
    day:     ['Ciao!', 'Tutto bene?', 'Eccomi qui!', 'Un saluto da Jenny.'],
    evening: ['Buonasera!', 'Ciao, serata!', 'Serata, come va?']
  };
  function greetingForHour() {
    var h = new Date().getHours();
    var b = (h >= 5 && h < 12) ? 'morning'
          : (h >= 12 && h < 18) ? 'day'
          : (h >= 18 && h < 23) ? 'evening' : 'night';
    var lines = AMBIENT_LINES[b] || AMBIENT_LINES.day;
    return lines[Math.floor(Math.random() * lines.length)];
  }
  function clearAmbientTimer() {
    if (ambientTimer) { clearTimeout(ambientTimer); ambientTimer = null; }
  }
  function scheduleAmbient() {
    clearAmbientTimer();
    if (!prefs.bubble) return;
    ambientTimer = setTimeout(
      ambientMaybe,
      AMBIENT_MIN_MS + Math.random() * (AMBIENT_MAX_MS - AMBIENT_MIN_MS)
    );
  }
  function ambientMaybe() {
    ambientTimer = null;
    if (!prefs.bubble) return;
    if (activePose !== 'idle' || sleeping) return;
    if (document.hidden) return;
    if (Date.now() - lastStateChangeAt < POSE_GUARD_MS) return;
    if (Date.now() - lastAmbientAt < AMBIENT_MIN_MS) return;
    lastAmbientAt = Date.now();
    showBubble(greetingForHour(), BUBBLE_DEFAULT_MS);
    scheduleAmbient();
  }

  /* ---- Sospensione quando nascosto / blur ---- */
  function onInvisible() {
    clearSleepTimer();
    stopIdleLife(true);
    clearAmbientTimer();
    hideBubble(true);
  }
  function onVisible() {
    if (activePose === 'idle' && !sleeping) {
      scheduleSleep();
      startIdleLife();
      scheduleAmbient();
    }
  }
  if (document.addEventListener) {
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) onInvisible(); else onVisible();
    });
    window.addEventListener('blur', onInvisible);
    window.addEventListener('focus', onVisible);
  }

  setPose('idle', false);
})();
</script>
</body>
</html>
